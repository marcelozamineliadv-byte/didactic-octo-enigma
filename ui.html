<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicações OAB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d3a6b'/%3E%3Cpath d='M16 7v18M10 25h12M8 11h16M11 11l-3 7a3 3 0 006 0zM21 11l-3 7a3 3 0 006 0z' stroke='%23e8c57a' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --sidebar: #14243f;
  --sidebar-2: #1c3155;
  --sidebar-text: #c9d3e3;
  --sidebar-muted: #8394b0;
  --text: #1a2230;
  --muted: #6a7486;
  --faint: #98a1b0;
  --border: #e3e6ec;
  --border-strong: #d2d7e0;
  --accent: #2456b8;
  --accent-soft: #e8eefb;
  --gold: #c9a14a;
  --gold-soft: #fbf4e3;
  --unread: #2456b8;
  --danger: #b4372f;
  --danger-soft: #fbeceb;
  --mark: #fde68a;
  --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg: 0 8px 28px rgba(16,24,40,.12);
  --radius: 10px;
  --serif: "Georgia", "Cambria", "Times New Roman", serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #161d28; --surface-2: #1b2331; --sidebar: #0b111b; --sidebar-2: #152034;
    --text: #e4e8ef; --muted: #9aa5b6; --faint: #6c7889; --border: #253042; --border-strong: #2f3c52;
    --accent: #7aa2f7; --accent-soft: #1d2a45; --gold-soft: #2a2416; --unread: #7aa2f7;
    --danger: #f08a80; --danger-soft: #3a1f1d; --mark: #6b5a17; --on-accent: #0b1220;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 8px 28px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #161d28; --surface-2: #1b2331; --sidebar: #0b111b; --sidebar-2: #152034;
  --text: #e4e8ef; --muted: #9aa5b6; --faint: #6c7889; --border: #253042; --border-strong: #2f3c52;
  --accent: #7aa2f7; --accent-soft: #1d2a45; --gold-soft: #2a2416; --unread: #7aa2f7;
  --danger: #f08a80; --danger-soft: #3a1f1d; --mark: #6b5a17; --on-accent: #0b1220;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 8px 28px rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: 264px minmax(340px, 440px) 1fr; height: 100vh; }

/* ---------- Sidebar ---------- */
.sidebar {
  background: linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-2) 100%);
  color: var(--sidebar-text); display: flex; flex-direction: column; padding: 22px 18px 16px; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: rgba(201,161,74,.14); border: 1px solid rgba(201,161,74,.35); color: var(--gold);
}
.brand-logo svg { width: 22px; height: 22px; }
.brand h1 { font-size: 15px; font-weight: 600; color: #fff; margin: 0; letter-spacing: .1px; }
.brand p { margin: 1px 0 0; font-size: 12px; color: var(--sidebar-muted); }

.side-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sidebar-muted); margin: 0 0 8px; }
.field-row { display: grid; grid-template-columns: 1fr 74px; gap: 8px; margin-bottom: 18px; }
.side-input, .side-select {
  width: 100%; height: 38px; padding: 0 11px; border-radius: 8px; outline: none;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: #fff; transition: border-color .15s, background .15s;
}
.side-input:focus, .side-select:focus { border-color: var(--gold); background: rgba(255,255,255,.09); }
.side-select option { color: #111; }
.side-input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.8); cursor: pointer; }

.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 3px; background: rgba(255,255,255,.05); border-radius: 9px; margin-bottom: 10px; }
.preset { border: 0; background: transparent; color: var(--sidebar-text); height: 30px; padding: 0; white-space: nowrap; border-radius: 7px; font-size: 12px; transition: background .15s, color .15s; }
.preset:hover { background: rgba(255,255,255,.07); }
.preset.on { background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
.dates { display: grid; gap: 6px; margin-bottom: 18px; }
.dates > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; }
.dates label { font-size: 12px; color: var(--sidebar-muted); }
.dates .side-input { height: 36px; padding: 0 10px; font-size: 13px; min-width: 0; }

.btn-search {
  height: 42px; border: 0; border-radius: 9px; background: var(--gold); color: #1b1606; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: filter .15s, transform .05s;
  box-shadow: 0 2px 10px rgba(201,161,74,.25);
}
.btn-search:hover { filter: brightness(1.06); }
.btn-search:active { transform: translateY(1px); }
.btn-search:disabled { opacity: .65; cursor: progress; }
.side-sep { height: 1px; background: rgba(255,255,255,.08); margin: 22px 0 18px; }
.side-actions { display: grid; gap: 4px; }
.side-btn {
  display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--sidebar-text); text-align: left; font-size: 13.5px; transition: background .15s, color .15s;
}
.side-btn:hover { background: rgba(255,255,255,.07); color: #fff; }
.side-foot { margin-top: auto; padding-top: 18px; font-size: 11.5px; color: var(--sidebar-muted); line-height: 1.5; }
.side-foot a { color: var(--sidebar-text); }

/* ---------- List ---------- */
.list-pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--surface); min-width: 0; }
.list-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
.list-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.list-title h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.list-title span { font-size: 12.5px; color: var(--muted); }
.search {
  display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 11px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--faint); transition: border-color .15s, box-shadow .15s;
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); min-width: 0; }
.search kbd { font: 11px var(--sans); color: var(--faint); border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; }
.chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.chip b { font-weight: 600; font-size: 11.5px; opacity: .8; }

.list { flex: 1; overflow-y: auto; padding: 4px 10px 18px; scroll-behavior: smooth; }
.group-h {
  position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 12px 8px 6px;
  font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between;
}
.card {
  position: relative; padding: 11px 12px 11px 22px; border-radius: 9px; cursor: pointer; border: 1px solid transparent;
  transition: background .12s, border-color .12s; margin-bottom: 2px; outline: none;
}
.card:hover { background: var(--surface-2); }
.card.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.card:focus-visible { border-color: var(--accent); }
.card .dot { position: absolute; left: 9px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: var(--unread); }
.card.read .dot { display: none; }
.card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 5px;
  background: var(--gold-soft); color: #8a6516;
}
:root[data-theme="dark"] .badge { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: var(--gold); } }
.card-type { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-proc { font: 600 13px var(--mono); letter-spacing: -.01em; margin-bottom: 2px; }
.card.read .card-proc { font-weight: 500; }
.card-org { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-partes { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.card-snip { font-size: 12.5px; color: var(--faint); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- Reader ---------- */
.reader { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.reader-scroll { flex: 1; overflow-y: auto; padding: 28px 40px 40px; }
.doc { max-width: 820px; margin: 0 auto; }
.doc-kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
.pill.gold { background: var(--gold-soft); border-color: transparent; color: #8a6516; font-weight: 600; }
:root[data-theme="dark"] .pill.gold { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.gold { color: var(--gold); } }
.doc h2 { font: 600 24px/1.25 var(--mono); letter-spacing: -.02em; margin: 0 0 4px; word-break: break-all; }
.doc-sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.doc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.btn {
  height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface);
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.meta {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; background: var(--border);
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px;
}
.meta div { background: var(--surface); padding: 10px 14px; }
.meta dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin-bottom: 2px; }
.meta dd { margin: 0; font-size: 13.5px; }
.alert-prazo {
  display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--radius); margin-bottom: 18px;
  background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); font-size: 13.5px;
}
.alert-prazo svg { color: var(--gold); margin-top: 1px; }
.teor {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 26px 30px; font: 15.5px/1.75 var(--serif); white-space: pre-wrap; word-wrap: break-word;
}
.teor-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 0 0 8px 2px; }

/* ---------- States ---------- */
.empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted); }
.empty-ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 14px; background: var(--accent-soft); color: var(--accent); }
.empty-ic svg { width: 28px; height: 28px; }
.empty h3 { margin: 0 0 4px; color: var(--text); font-size: 16px; font-weight: 600; }
.empty p { margin: 0 auto; max-width: 320px; font-size: 13.5px; }
.empty .btn { margin-top: 14px; }
.sk { border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: sh 1.3s infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.sk-card { padding: 14px 12px 14px 22px; }
.sk-card .sk { height: 11px; margin-bottom: 8px; }
.err {
  margin: 12px 8px; padding: 12px 14px; border-radius: 9px; background: var(--danger-soft); color: var(--danger); font-size: 13px;
  border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent);
}
.err strong { display: block; margin-bottom: 2px; }
.err button { margin-top: 8px; border: 0; background: transparent; color: var(--danger); text-decoration: underline; padding: 0; font-weight: 600; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(27,22,6,.25); border-top-color: #1b1606; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #1a2230; color: #fff; padding: 9px 16px; white-space: nowrap; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow-lg); transition: all .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.theme-btn { position: absolute; top: 14px; right: 16px; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); display: grid; place-items: center; }
.theme-btn:hover { color: var(--text); }
.reader { position: relative; }
.back-btn { display: none; }

/* ---------- Print ---------- */
#print { display: none; }
@media print {
  body { overflow: visible; background: #fff; color: #000; }
  .app, .toast { display: none !important; }
  #print { display: block; font: 11pt/1.5 var(--serif); }
  #print h1 { font: 600 16pt var(--sans); margin: 0 0 2pt; }
  #print .p-sub { font: 10pt var(--sans); color: #555; margin-bottom: 14pt; }
  #print .p-item { border-top: 1px solid #bbb; padding: 10pt 0; break-inside: avoid-page; }
  #print .p-h { font: 600 11pt var(--sans); }
  #print .p-m { font: 9.5pt var(--sans); color: #444; margin: 2pt 0 6pt; }
  #print .p-t { white-space: pre-wrap; }
}

/* ---------- Narrow windows ---------- */
@media (max-width: 1100px) { .app { grid-template-columns: 230px minmax(300px, 380px) 1fr; } .reader-scroll { padding: 24px 24px 32px; } }
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .sidebar { padding: 16px; }
  .side-actions, .side-foot, .side-sep { display: none; }
  .list-pane { border-right: 0; }
  .list { max-height: none; overflow: visible; }
  .reader { display: none; }
  .app.reading .list-pane, .app.reading .sidebar { display: none; }
  .app.reading .reader { display: flex; min-height: 100vh; }
  .back-btn { display: inline-flex; margin-bottom: 14px; }
  .reader-scroll { padding: 18px 16px 30px; }
  .teor { padding: 18px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24" class="i"><path d="M12 3v18M7 21h10M4 7h16M7 7l-3 7a3 3 0 006 0zM17 7l-3 7a3 3 0 006 0z"/></svg></div>
      <div><h1>Publicações</h1><p>Diário de Justiça Eletrônico</p></div>
    </div>

    <p class="side-label">Advogado(a)</p>
    <div class="field-row">
      <input class="side-input" id="oab" placeholder="Nº da OAB" inputmode="numeric" aria-label="Número da OAB">
      <select class="side-select" id="uf" aria-label="UF"></select>
    </div>

    <p class="side-label">Período</p>
    <div class="presets" id="presets">
      <button class="preset" data-d="0">Hoje</button>
      <button class="preset" data-d="7">7 dias</button>
      <button class="preset" data-d="30">30 dias</button>
      <button class="preset" data-d="90">90 dias</button>
    </div>
    <div class="dates">
      <div><label for="ini">De</label><input class="side-input" type="date" id="ini"></div>
      <div><label for="fim">Até</label><input class="side-input" type="date" id="fim"></div>
    </div>

    <button class="btn-search" id="buscar">
      <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Buscar publicações</span>
    </button>

    <div class="side-sep"></div>
    <p class="side-label">Ações</p>
    <div class="side-actions">
      <button class="side-btn" id="marcarTodas"><svg viewBox="0 0 24 24" class="i"><path d="M2 12l5 5L18 6M12 17l1 1 9-11"/></svg>Marcar todas como lidas</button>
      <button class="side-btn" id="expCsv"><svg viewBox="0 0 24 24" class="i"><path d="M4 4h16v16H4zM4 10h16M4 15h16M10 4v16"/></svg>Exportar para Excel</button>
      <button class="side-btn" id="imprimir"><svg viewBox="0 0 24 24" class="i"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>Imprimir / salvar PDF</button>
      <button class="side-btn" id="siteCnj"><svg viewBox="0 0 24 24" class="i"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>Abrir consulta no CNJ</button>
    </div>

    <div class="side-foot">Fonte: DJEN · Comunica PJe (CNJ).<br>Ferramenta de apoio — confira sempre os prazos nos meios oficiais.</div>
  </aside>

  <!-- List -->
  <section class="list-pane">
    <div class="list-head">
      <div class="list-title"><h2>Intimações</h2><span id="resumo"></span></div>
      <label class="search">
        <svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="filtro" placeholder="Filtrar por parte, processo, vara…" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list" tabindex="-1"></div>
  </section>

  <!-- Reader -->
  <main class="reader">
    <button class="theme-btn" id="tema" title="Alternar tema claro/escuro">
      <svg viewBox="0 0 24 24" class="i"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
    <div class="reader-scroll" id="reader"></div>
  </main>
</div>

<div id="print"></div>
<div class="toast" id="toast"></div>

<script>
const UFS = ["AC","AL","AM","AP","BA","CE","DF","ES","GO","MA","MG","MS","MT","PA","PB","PE","PI","PR","RJ","RN","RO","RR","RS","SC","SE","SP","TO"];
const $ = (s) => document.querySelector(s);
const S = { pubs: [], view: [], sel: null, tribunal: "", soNovas: false, termo: "", loading: false, erro: null, buscou: false };

const ICON = {
  doc: '<svg viewBox="0 0 24 24" class="i"><path d="M14 3H6v18h12V7zM14 3v4h4M9 12h6M9 16h6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" class="i"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>',
  ext: '<svg viewBox="0 0 24 24" class="i"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" class="i"><path d="M3 13l3-8h12l3 8v6H3zM3 13h5l1 3h6l1-3h5"/></svg>',
  search: '<svg viewBox="0 0 24 24" class="i"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  back: '<svg viewBox="0 0 24 24" class="i"><path d="M15 18l-6-6 6-6"/></svg>',
  unread: '<svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="4"/></svg>',
};

// ---------- utils ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const br2date = (s) => { const m = /^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s || ""); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function hl(text, termo) {
  const t = esc(text);
  if (!termo) return t;
  const re = new RegExp(termo.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  return t.replace(re, (m) => `<mark>${m}</mark>`);
}
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200);
}
function rotuloData(s) {
  const d = br2date(s); if (!d) return s || "Sem data";
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const diff = Math.round((hoje - d) / 86400000);
  if (diff === 0) return "Hoje";
  if (diff === 1) return "Ontem";
  const txt = d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
function prazos(texto) {
  const re = /prazo\s+(?:legal\s+|comum\s+|sucessivo\s+)?de\s+(\d{1,3})\s*(?:\([^)]{1,30}\))?\s*(dias?(?:\s+[uú]teis|\s+corridos)?|horas)/gi;
  const out = new Set(); let m;
  while ((m = re.exec(texto || ""))) out.add(`${m[1]} ${m[2].toLowerCase()}`);
  return [...out];
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.erro) throw new Error(j.erro || `Erro ${r.status}`);
  return j;
}

// ---------- filtering ----------
function filtrar() {
  const t = norm(S.termo);
  S.view = S.pubs.filter((p) =>
    (!S.tribunal || p.tribunal === S.tribunal) &&
    (!S.soNovas || !p.lida) &&
    (!t || p._busca.includes(t)));
  render();
}

// ---------- render ----------
function renderChips() {
  const cont = {};
  S.pubs.forEach((p) => { cont[p.tribunal] = (cont[p.tribunal] || 0) + 1; });
  const novas = S.pubs.filter((p) => !p.lida).length;
  const trib = Object.entries(cont).sort((a, b) => b[1] - a[1]);
  let h = `<button class="chip ${!S.tribunal && !S.soNovas ? "on" : ""}" data-k="todas">Todas <b>${S.pubs.length}</b></button>`;
  h += `<button class="chip ${S.soNovas ? "on" : ""}" data-k="novas">Não lidas <b>${novas}</b></button>`;
  trib.forEach(([t, n]) => { h += `<button class="chip ${S.tribunal === t ? "on" : ""}" data-k="t" data-t="${esc(t)}">${esc(t || "—")} <b>${n}</b></button>`; });
  $("#chips").innerHTML = S.pubs.length ? h : "";
  const total = S.pubs.length;
  $("#resumo").textContent = total ? `${S.view.length} de ${total} · ${novas} não lida${novas === 1 ? "" : "s"}` : "";
}

function renderList() {
  const el = $("#list");
  if (S.loading) {
    el.innerHTML = Array.from({ length: 7 }, () =>
      `<div class="sk-card"><div class="sk" style="width:38%"></div><div class="sk" style="width:72%"></div><div class="sk" style="width:90%;margin:0"></div></div>`).join("");
    return;
  }
  if (S.erro) {
    el.innerHTML = `<div class="err"><strong>Não foi possível consultar o DJEN</strong>${esc(S.erro)}<br><button id="errCnj">Abrir a consulta no site do CNJ</button></div>`;
    $("#errCnj").onclick = abrirCnj;
    return;
  }
  if (!S.view.length) {
    const filtrando = S.pubs.length > 0;
    el.innerHTML = `<div class="empty"><div><div class="empty-ic">${filtrando ? ICON.search : ICON.inbox}</div>
      <h3>${filtrando ? "Nada corresponde ao filtro" : S.buscou ? "Nenhuma publicação no período" : "Pronto para buscar"}</h3>
      <p>${filtrando ? "Tente outro termo ou limpe os filtros." : S.buscou ? "Não há intimações para esta OAB nas datas escolhidas. Experimente ampliar o período." : "Informe a OAB e o período e clique em Buscar."}</p></div></div>`;
    return;
  }
  let h = "", grupo = null;
  const grupos = {};
  S.view.forEach((p) => { grupos[p.data] = (grupos[p.data] || 0) + 1; });
  S.view.forEach((p, i) => {
    if (p.data !== grupo) {
      grupo = p.data;
      h += `<div class="group-h"><span>${esc(rotuloData(p.data))}</span><span>${grupos[p.data]}</span></div>`;
    }
    const snip = (p.texto || "").replace(/\s+/g, " ").slice(0, 220);
    h += `<div class="card ${p.lida ? "read" : ""} ${S.sel === p ? "sel" : ""}" data-i="${i}" tabindex="0">
      <span class="dot" title="Não lida"></span>
      <div class="card-top"><span class="badge">${esc(p.tribunal || "—")}</span><span class="card-type">${esc([p.tipo, p.documento].filter(Boolean).join(" · "))}</span></div>
      <div class="card-proc">${hl(p.processo || "Sem número", S.termo)}</div>
      <div class="card-org">${hl(p.orgao, S.termo)}</div>
      ${p.partes ? `<div class="card-partes">${hl(p.partes, S.termo)}</div>` : ""}
      ${snip ? `<div class="card-snip">${hl(snip, S.termo)}</div>` : ""}
    </div>`;
  });
  el.innerHTML = h;
}

function renderReader() {
  const el = $("#reader");
  const p = S.sel;
  if (!p) {
    el.innerHTML = `<div class="empty"><div><div class="empty-ic">${ICON.doc}</div><h3>Selecione uma intimação</h3>
      <p>O teor completo aparece aqui. Use as setas ↑ ↓ para navegar pela lista.</p></div></div>`;
    return;
  }
  const pz = prazos(p.texto);
  const meta = [["Órgão julgador", p.orgao], ["Classe", p.classe], ["Partes", p.partes], ["Advogados", p.advogados]]
    .filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${hl(v, S.termo)}</dd></div>`).join("");
  el.innerHTML = `<article class="doc">
    <button class="btn back-btn" id="voltar">${ICON.back} Voltar</button>
    <div class="doc-kicker">
      <span class="pill gold">${esc(p.tribunal || "—")}</span>
      ${p.tipo ? `<span class="pill">${esc(p.tipo)}</span>` : ""}
      ${p.documento ? `<span class="pill">${esc(p.documento)}</span>` : ""}
      <span class="pill">Disponibilizada em ${esc(p.data)}</span>
    </div>
    <h2>${esc(p.processo || "Processo sem número")}</h2>
    <div class="doc-sub">${esc(p.orgao)}</div>
    <div class="doc-actions">
      ${p.link ? `<button class="btn primary" id="abrirDoc">${ICON.ext} Abrir documento</button>` : ""}
      <button class="btn" id="copiar">${ICON.copy} Copiar teor</button>
      <button class="btn" id="copiarProc">${ICON.copy} Copiar nº do processo</button>
      <button class="btn" id="naoLida">${ICON.unread} Marcar como não lida</button>
    </div>
    ${pz.length ? `<div class="alert-prazo">${ICON.clock}<div><strong>Prazo mencionado no texto:</strong> ${pz.map(esc).join(", ")}. Confira a contagem nos autos.</div></div>` : ""}
    ${meta ? `<dl class="meta">${meta}</dl>` : ""}
    <p class="teor-label">Teor da publicação</p>
    <div class="teor">${hl(p.texto || "(Sem teor disponível.)", S.termo)}</div>
  </article>`;
  el.scrollTop = 0;
  if (p.link) $("#abrirDoc").onclick = () => window.open(p.link, "_blank");
  $("#copiar").onclick = () => copiar(`Processo ${p.processo} (${p.tribunal}) — ${p.data}\n${p.orgao}\n\n${p.texto}`, "Teor copiado");
  $("#copiarProc").onclick = () => copiar(p.processo, "Número do processo copiado");
  $("#naoLida").onclick = () => { p.lida = false; api("/api/lidas", { ids: [p.id], lida: false }).catch(() => {}); renderChips(); renderList(); toast("Marcada como não lida"); };
  $("#voltar").onclick = () => $("#app").classList.remove("reading");
}

function render() { renderChips(); renderList(); renderReader(); }

async function copiar(txt, msg) {
  try { await navigator.clipboard.writeText(txt); }
  catch { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast(msg);
}

function selecionar(i, foco) {
  const p = S.view[i]; if (!p) return;
  S.sel = p;
  if (!p.lida) { p.lida = true; api("/api/lidas", { ids: [p.id], lida: true }).catch(() => {}); renderChips(); }
  document.querySelectorAll(".card.sel").forEach((c) => c.classList.remove("sel"));
  const card = document.querySelector(`.card[data-i="${i}"]`);
  if (card) { card.classList.add("sel", "read"); card.scrollIntoView({ block: "nearest" }); if (foco) card.focus({ preventScroll: true }); }
  $("#app").classList.add("reading");
  renderReader();
}

// ---------- actions ----------
function setPreset(d) {
  const fim = new Date(), ini = new Date(); ini.setDate(ini.getDate() - d);
  $("#ini").value = iso(ini); $("#fim").value = iso(fim); marcarPreset();
}
function marcarPreset() {
  const hoje = iso(new Date());
  document.querySelectorAll(".preset").forEach((b) => {
    const ini = new Date(); ini.setDate(ini.getDate() - +b.dataset.d);
    b.classList.toggle("on", $("#fim").value === hoje && $("#ini").value === iso(ini));
  });
}

async function buscar() {
  if (S.loading) return;
  const oab = $("#oab").value.replace(/\D/g, "");
  if (!oab) { toast("Informe o número da OAB"); $("#oab").focus(); return; }
  if (!$("#ini").value || !$("#fim").value) { toast("Informe o período"); return; }
  S.loading = true; S.erro = null; S.sel = null;
  const btn = $("#buscar"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span><span>Consultando o DJEN…</span>`;
  render();
  try {
    const r = await api("/api/buscar", { oab, uf: $("#uf").value, inicio: $("#ini").value, fim: $("#fim").value });
    S.pubs = r.publicacoes.map((p) => ({ ...p, _busca: norm(Object.values(p).join(" ")) }));
    S.buscou = true;
  } catch (e) {
    S.erro = e.message; S.pubs = [];
  } finally {
    S.loading = false; btn.disabled = false;
    btn.innerHTML = `${ICON.search}<span>Buscar publicações</span>`;
    filtrar();
    if (S.buscou && !S.erro) toast(S.pubs.length ? `${S.pubs.length} publicaç${S.pubs.length === 1 ? "ão encontrada" : "ões encontradas"}` : "Nenhuma publicação no período");
  }
}

function exportarCsv() {
  if (!S.view.length) return toast("Não há publicações para exportar");
  const cols = [["data","Data"],["tribunal","Tribunal"],["processo","Processo"],["tipo","Tipo"],["documento","Documento"],["orgao","Órgão"],["classe","Classe"],["partes","Partes"],["advogados","Advogados"],["link","Link"],["texto","Teor"]];
  const cel = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const linhas = [cols.map((c) => c[1]).join(";"), ...S.view.map((p) => cols.map((c) => cel(p[c[0]])).join(";"))];
  const blob = new Blob(["﻿" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `publicacoes_OAB${$("#oab").value.replace(/\D/g, "")}${$("#uf").value}_${iso(new Date())}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Planilha salva na pasta Downloads");
}

function imprimir() {
  if (!S.view.length) return toast("Não há publicações para imprimir");
  const fmt = (v) => v.split("-").reverse().join("/");
  $("#print").innerHTML = `<h1>Publicações — OAB ${esc($("#oab").value)}/${esc($("#uf").value)}</h1>
    <div class="p-sub">Período: ${fmt($("#ini").value)} a ${fmt($("#fim").value)} · ${S.view.length} publicação(ões) · Fonte: DJEN/CNJ</div>
    ${S.view.map((p) => `<div class="p-item"><div class="p-h">${esc(p.data)} · ${esc(p.tribunal)} · ${esc(p.processo)}</div>
      <div class="p-m">${esc([p.tipo, p.documento, p.orgao, p.classe].filter(Boolean).join(" · "))}${p.partes ? `<br>Partes: ${esc(p.partes)}` : ""}</div>
      <div class="p-t">${esc(p.texto)}</div></div>`).join("")}`;
  window.print();
}

function abrirCnj() { window.open("https://comunica.pje.jus.br/consulta", "_blank"); }

async function marcarTodas() {
  if (!S.pubs.length) return;
  S.pubs.forEach((p) => (p.lida = true));
  api("/api/lidas", { ids: S.pubs.map((p) => p.id), lida: true }).catch(() => {});
  filtrar(); toast("Todas marcadas como lidas");
}

// ---------- theme ----------
function aplicarTema(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
try { aplicarTema(localStorage.getItem("tema")); } catch {}
$("#tema").onclick = () => {
  const escuro = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const novo = escuro ? "light" : "dark";
  aplicarTema(novo); try { localStorage.setItem("tema", novo); } catch {}
};

// ---------- events ----------
$("#uf").innerHTML = UFS.map((u) => `<option>${u}</option>`).join("");
$("#presets").onclick = (e) => { const b = e.target.closest(".preset"); if (b) setPreset(+b.dataset.d); };
$("#ini").onchange = $("#fim").onchange = marcarPreset;
$("#buscar").onclick = buscar;
$("#oab").onkeydown = (e) => { if (e.key === "Enter") buscar(); };
$("#filtro").oninput = (e) => { S.termo = e.target.value.trim(); filtrar(); };
$("#chips").onclick = (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (c.dataset.k === "todas") { S.tribunal = ""; S.soNovas = false; }
  else if (c.dataset.k === "novas") S.soNovas = !S.soNovas;
  else S.tribunal = S.tribunal === c.dataset.t ? "" : c.dataset.t;
  filtrar();
};
$("#list").onclick = (e) => { const c = e.target.closest(".card"); if (c) selecionar(+c.dataset.i); };
$("#list").ondblclick = (e) => { const c = e.target.closest(".card"); const p = c && S.view[+c.dataset.i]; if (p && p.link) window.open(p.link, "_blank"); };
$("#marcarTodas").onclick = marcarTodas;
$("#expCsv").onclick = exportarCsv;
$("#imprimir").onclick = imprimir;
$("#siteCnj").onclick = abrirCnj;
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#filtro").focus(); $("#filtro").select(); return; }
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "j" || e.key === "k") {
    if (!S.view.length) return;
    e.preventDefault();
    const atual = S.view.indexOf(S.sel);
    const prox = e.key === "ArrowDown" || e.key === "j" ? Math.min(S.view.length - 1, atual + 1) : Math.max(0, atual - 1);
    selecionar(atual < 0 ? 0 : prox, true);
  }
  if (e.key === "Enter" && S.sel && S.sel.link) window.open(S.sel.link, "_blank");
});

// mantém o servidor local ativo enquanto a janela estiver aberta
setInterval(() => fetch("/api/ping", { method: "POST" }).catch(() => {}), 10000);

// ---------- init ----------
(async () => {
  let cfg = { oab: "517745", uf: "SP", dias: 7 };
  try { cfg = { ...cfg, ...(await api("/api/config")) }; } catch {}
  $("#oab").value = cfg.oab; $("#uf").value = cfg.uf;
  setPreset(Number.isFinite(+cfg.dias) ? +cfg.dias : 7);
  render();
  buscar();
})();
</script>
</body>
</html>
